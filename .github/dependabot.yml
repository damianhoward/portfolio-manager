version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Inherited from the shared platform, not declared here. The Kotlin version belongs to
      # build-conventions and moves only in a platform release that every repository adopts
      # together, so a per-repository bump would split the estate across compiler lines.
      - dependency-name: "org.jetbrains.kotlin.jvm"
      # The shared platform. A release moves the convention plugins and the catalog together, and
      # document 07 adopts it across every repository in one sweep; a bump raised here would move
      # the plugins alone and leave this repository on a platform no other one runs. Matched by
      # prefix so that a repository applying a different convention plugin cannot miss the entry.
      - dependency-name: "com.damianhoward.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
