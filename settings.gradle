pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.namespace == 'com.damianhoward') {
                useModule("com.github.damianhoward.build-conventions:plugins:${requested.version}")
            }
        }
    }
}

// The shared version catalog: versions two or more repos genuinely share (see the
// version-catalog repo); application-specific dependencies stay in build.gradle.
dependencyResolutionManagement {
    repositories {
        maven { url = uri('https://jitpack.io') }
    }
    versionCatalogs {
        create('deps') {
            from 'com.github.damianhoward.build-conventions:catalog:0.5.3'
        }
    }
}

rootProject.name = 'portfolio-manager'
